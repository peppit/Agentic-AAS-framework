server:
  port: 8087

spring:
  application:
    name: operation-delegation-service

logging:
  level:
    root: INFO
    com.openindustryproject: DEBUG

simulation:
  identity:
    aliases:
      "urn:agent-aas:asset-instance:conveyor01": Conveyor_01
      "urn:agent-aas:entity:oip-factory01:pallet01": Pallet_01
    source-stations:
      "urn:agent-aas:asset-instance:conveyor01": Station_01
  mqtt:
    enabled: true
    broker-url: tcp://mosquitto:1883
    client-id: operation-delegation-service
    qos: 1
    station-topic-template: simulation/{stationId}/operations/{operation}
    robot-topic-template: simulation/robots/{robotId}/operations/{operation}
